<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to AniList - JoyFlix</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #05070f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #111422;
            border: 1px solid rgba(2, 169, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(2, 169, 255, 0.2);
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            padding: 32px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background: #02a9ff;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(2, 169, 255, 0.4);
            box-sizing: border-box;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin: 0 0 10px; font-size: 22px;">AniList Authorization</h2>
        <p style="color: #9ca3af; font-size: 14px; line-height: 1.5; margin: 0 0 20px;">
            Redirecting your authentication back to the JoyFlix app...
        </p>
        <a id="launchBtn" class="btn" href="#">🚀 Open JoyFlix App</a>
    </div>

    <script>
        const hash = window.location.hash || '';
        const search = window.location.search || '';
        const queryParams = hash ? ('?' + hash.replace(/^#\/?/, '')) : search;
        const deepLink = 'joyflixapp://anilistlogin' + queryParams;
        document.getElementById('launchBtn').href = deepLink;
        try {
            window.location.href = deepLink;
        } catch(e) {}
    </script>
</body>
</html>
